version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: aquarium-backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      NODE_ENV: production
    networks:
      - aquarium-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquarium-frontend
    ports:
      - "3000:3000"
    environment:
      VITE_API_URL: http://backend:5000
    networks:
      - aquarium-network
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

networks:
  aquarium-network:
    driver: bridge
